name: Build NET DOCTOR (from private source)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [build]

permissions:
  contents: write

env:
  APP_VER: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: professor-ayman/net-doctor
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps our MainActivity + Manifest)
        run: flutter create --platforms=android --org com.professor --project-name net_doctor .

      - name: Set minSdk 23
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
            grep -n "minSdk" "$f"
          done

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --build-name=$APP_VER --build-number=${{ github.run_number }}

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NET-DOCTOR-$APP_VER.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$APP_VER
          gh release create "$TAG" -R ${{ github.repository }} --title "NET DOCTOR $TAG" --notes "NET DOCTOR — by PROFESSOR" --target main || true
          gh release upload "$TAG" dist/*.apk -R ${{ github.repository }} --clobber

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: professor-ayman/net-doctor
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --org com.professor --project-name net_doctor .

      - name: Branding (title, exe name, publisher)
        shell: pwsh
        run: |
          (Get-Content windows/runner/main.cpp) -replace 'L"net_doctor"', 'L"NET DOCTOR"' | Set-Content windows/runner/main.cpp
          (Get-Content windows/runner/Runner.rc) -replace '"net_doctor"', '"NET DOCTOR"' -replace '"net_doctor.exe"', '"NetDoctor.exe"' -replace '"com.professor"', '"PROFESSOR"' | Set-Content windows/runner/Runner.rc
          (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "net_doctor"\)', 'set(BINARY_NAME "NetDoctor")' | Set-Content windows/CMakeLists.txt
          Select-String -Path windows/CMakeLists.txt -Pattern 'BINARY_NAME'

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --build-name=${{ env.APP_VER }} --build-number=${{ github.run_number }}

      - name: Add VC++ runtime next to the exe
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            $src = Join-Path $env:WINDIR "System32\$d"
            if (Test-Path $src) { Copy-Item $src $rel }
          }
          Get-ChildItem $rel

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\net_doctor.iss
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/NET-DOCTOR-Portable.zip
          Get-ChildItem dist

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$APP_VER
          sleep 20
          gh release create "$TAG" -R ${{ github.repository }} --title "NET DOCTOR $TAG" --notes "NET DOCTOR — by PROFESSOR" --target main || true
          gh release upload "$TAG" dist/NET-DOCTOR-Setup.exe dist/NET-DOCTOR-Portable.zip -R ${{ github.repository }} --clobber
