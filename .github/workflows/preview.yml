name: Map preview
on: workflow_dispatch
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: professor-ayman/net-doctor
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib || true
      - run: flutter test --update-goldens test/map_preview_test.dart
      - name: Upload preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create preview -R ${{ github.repository }} --title "preview" --notes "preview images" --prerelease || true
          gh release upload preview test/goldens/*.png -R ${{ github.repository }} --clobber
